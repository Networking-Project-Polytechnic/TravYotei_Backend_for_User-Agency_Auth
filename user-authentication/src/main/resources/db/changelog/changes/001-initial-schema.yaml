databaseChangeLog:
  - changeSet:
      id: initial-schema-setup
      author: antigravity
      changes:
        - createTable:
            tableName: Users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: UsersPK
                    nullable: false
              - column:
                  name: firstName
                  type: VARCHAR(255)
              - column:
                  name: lastName
                  type: VARCHAR(255)
              - column:
                  name: userName
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: password
                  type: VARCHAR(255)
              - column:
                  name: role
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(255)
              - column:
                  name: profileImageUrl
                  type: VARCHAR(255)
              - column:
                  name: phoneNumber
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: VARCHAR(255)
              - column:
                  name: licenseNumber
                  type: VARCHAR(255)
              - column:
                  name: bio
                  type: TEXT
